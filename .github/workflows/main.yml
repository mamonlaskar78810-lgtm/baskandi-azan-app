name: Build Baskandi Madrasa Azan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Project Directory
        run: |
          mkdir -p project_files
          unzip -o *.zip -d project_files || true

      - name: Find Project Root and Build
        run: |
          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          fi
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          
          echo "Building in directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          mkdir -p /tmp/output
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/output/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Baskandi-Azan-APK
          path: /tmp/output/app
