name: Build and Upload APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baskandi-Azan-APK
          path: '**/*.apk'
          if-no-files-found: warn
