name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Unzip Project Files
        run: |
          mkdir -p project_files
          unzip -o *.zip -d project_files || true

      - name: Find Project Root & Build
        run: |
          ROOT_DIR=$(find project_files -name "pubspec.yaml" -exec dirname {} \;)
          echo "Found project at $ROOT_DIR"
          cd "$ROOT_DIR"
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          mkdir -p /tmp/output
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baskandi-Azan-APK
          path: /tmp/output/
